<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Circuit & Line Gradient -->
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="250" cy="250" r="210" fill="url(#bgGlow)"/>

  <!-- Scanning Orbital Rings -->
  <circle cx="250" cy="250" r="185" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.45"/>
  <circle cx="250" cy="250" r="145" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="16 10" opacity="0.35"/>

  <!-- Orbital Data Nodes -->
  <circle cx="120" cy="180" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="380" cy="160" r="6" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="370" cy="340" r="4" fill="#60a5fa" filter="url(#glow)"/>
  <circle cx="130" cy="330" r="5" fill="#22d3ee" filter="url(#glow)"/>

  <!-- Connecting Circuit Traces -->
  <path d="M 90 250 L 170 250 L 195 285" fill="none" stroke="url(#cyberLine)" stroke-width="2"/>
  <path d="M 410 250 L 330 250 L 305 215" fill="none" stroke="url(#cyberLine)" stroke-width="2"/>
  <path d="M 250 80 L 250 140" fill="none" stroke="url(#cyberLine)" stroke-width="2"/>
  <path d="M 250 420 L 250 360" fill="none" stroke="url(#cyberLine)" stroke-width="2"/>

  <!-- Main Cyber Shield (Outer) -->
  <g filter="url(#softShadow)">
    <path d="M 250 95 
             C 320 95, 375 125, 375 180 
             C 375 275, 310 355, 250 395 
             C 190 355, 125 275, 125 180 
             C 125 125, 180 95, 250 95 Z" 
          fill="url(#shieldGrad)" />
  </g>

  <!-- Inner Dark Core Shield -->
  <path d="M 250 110 
           C 310 110, 358 136, 358 184 
           C 358 268, 302 340, 250 376 
           C 198 340, 142 268, 142 184 
           C 142 136, 190 110, 250 110 Z" 
        fill="url(#innerShield)" 
        stroke="#38bdf8" 
        stroke-width="2.5" 
        stroke-opacity="0.6"/>

  <!-- Grid Pattern Overlay in Shield -->
  <g opacity="0.18">
    <line x1="170" y1="160" x2="330" y2="160" stroke="#38bdf8" stroke-width="1"/>
    <line x1="160" y1="200" x2="340" y2="200" stroke="#38bdf8" stroke-width="1"/>
    <line x1="170" y1="240" x2="330" y2="240" stroke="#38bdf8" stroke-width="1"/>
    <line x1="190" y1="280" x2="310" y2="280" stroke="#38bdf8" stroke-width="1"/>
    <line x1="210" y1="320" x2="290" y2="320" stroke="#38bdf8" stroke-width="1"/>
    <line x1="210" y1="130" x2="210" y2="340" stroke="#38bdf8" stroke-width="1"/>
    <line x1="250" y1="120" x2="250" y2="370" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="290" y1="130" x2="290" y2="340" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Central AI Hologram Core -->
  <circle cx="250" cy="225" r="48" fill="#0369a1" fill-opacity="0.35" filter="url(#glow)"/>
  <circle cx="250" cy="225" r="40" fill="#082f49" stroke="#00f2fe" stroke-width="2.5"/>

  <!-- AI Brain / Digital Microchip Center -->
  <rect x="233" y="208" width="34" height="34" rx="6" fill="#0284c7" filter="url(#glow)"/>
  <rect x="236" y="211" width="28" height="28" rx="4" fill="#0c4a6e"/>

  <!-- Glowing Checkmark / Shield Emblem -->
  <path d="M 242 225 L 248 231 L 259 219" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Chip Pin Leads -->
  <line x1="227" y1="216" x2="233" y2="216" stroke="#38bdf8" stroke-width="2"/>
  <line x1="227" y1="225" x2="233" y2="225" stroke="#38bdf8" stroke-width="2"/>
  <line x1="227" y1="234" x2="233" y2="234" stroke="#38bdf8" stroke-width="2"/>
  <line x1="267" y1="216" x2="273" y2="216" stroke="#38bdf8" stroke-width="2"/>
  <line x1="267" y1="225" x2="273" y2="225" stroke="#38bdf8" stroke-width="2"/>
  <line x1="267" y1="234" x2="273" y2="234" stroke="#38bdf8" stroke-width="2"/>

  <!-- Floating Hologram Badges -->
  <!-- Left Badge: "PA05 SECURE" -->
  <g transform="translate(100, 140)">
    <rect width="90" height="30" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" opacity="0.92"/>
    <circle cx="16" cy="15" r="4" fill="#10b981" filter="url(#glow)"/>
    <text x="28" y="19" fill="#e2e8f0" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" letter-spacing="0.5">AN TOÀN</text>
  </g>

  <!-- Right Badge: "AI VERIFIED" -->
  <g transform="translate(315, 280)">
    <rect width="95" height="30" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.92"/>
    <circle cx="16" cy="15" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <text x="27" y="19" fill="#e2e8f0" font-size="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="bold" letter-spacing="0.5">AI CHECK</text>
  </g>

  <!-- Floating Sparkles & Light Points -->
  <polygon points="250,70 253,78 261,81 253,84 250,92 247,84 239,81 247,78" fill="#a5f3fc" filter="url(#glow)"/>
  <polygon points="380,210 382,216 388,218 382,220 380,226 378,220 372,218 378,216" fill="#38bdf8" filter="url(#glow)"/>
  <polygon points="120,290 122,295 127,297 122,299 120,304 118,299 113,297 118,295" fill="#67e8f9" filter="url(#glow)"/>
</svg>