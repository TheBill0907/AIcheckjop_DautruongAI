<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="100%" height="100%">
  <defs>
    <!-- Gradients for Robot -->
    <linearGradient id="botPlating" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="botBluePlating" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="botVisor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="botCyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="botGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="botDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0284c7" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Ground Hover Glow Shadow -->
  <ellipse cx="230" cy="450" rx="110" ry="18" fill="#0284c7" fill-opacity="0.22" filter="url(#botGlow)"/>
  <ellipse cx="230" cy="450" rx="70" ry="10" fill="#38bdf8" fill-opacity="0.45" filter="url(#botGlow)"/>

  <!-- Thruster Float Jet -->
  <path d="M 195 385 Q 230 445 265 385 Z" fill="url(#botCyanGlow)" opacity="0.85" filter="url(#botGlow)"/>
  <path d="M 210 385 Q 230 425 250 385 Z" fill="#ffffff" opacity="0.9"/>

  <!-- MAIN ROBOT BODY GROUP (Filter Drop Shadow) -->
  <g filter="url(#botDropShadow)">

    <!-- Left Arm (Holding Safety Shield) -->
    <g transform="translate(0, 0)">
      <path d="M 135 260 C 105 270, 95 310, 115 340 C 125 355, 145 350, 145 330" fill="none" stroke="url(#botPlating)" stroke-width="20" stroke-linecap="round"/>
      <circle cx="115" cy="340" r="14" fill="url(#botBluePlating)"/>
      
      <!-- Security Shield held in Left Hand -->
      <g transform="translate(60, 260)">
        <path d="M 50 10 Q 75 10 90 25 Q 90 70 50 105 Q 10 70 10 25 Q 25 10 50 10 Z" fill="url(#botBluePlating)" stroke="#ffffff" stroke-width="3"/>
        <path d="M 50 18 Q 70 18 82 30 Q 82 66 50 94 Q 18 66 18 30 Q 30 18 50 18 Z" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
        <!-- Shield Checkmark Icon -->
        <path d="M 36 50 L 46 60 L 64 40" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#botGlow)"/>
        <!-- Star sparkles on shield -->
        <circle cx="50" cy="30" r="2.5" fill="#ffffff" filter="url(#botGlow)"/>
      </g>
    </g>

    <!-- Right Arm (Friendly Waving) -->
    <g transform="translate(0, 0)">
      <path d="M 325 260 C 365 240, 395 210, 385 170 C 380 150, 360 160, 355 175" fill="none" stroke="url(#botPlating)" stroke-width="20" stroke-linecap="round"/>
      <!-- Hand / Palm -->
      <circle cx="375" cy="165" r="15" fill="url(#botBluePlating)"/>
      <rect x="368" y="145" width="8" height="16" rx="4" fill="#ffffff" transform="rotate(-15, 372, 153)"/>
      <rect x="378" y="148" width="7" height="15" rx="3.5" fill="#ffffff"/>
      <rect x="388" y="154" width="7" height="14" rx="3.5" fill="#ffffff" transform="rotate(15, 391, 161)"/>
    </g>

    <!-- Torso / Chest Body -->
    <rect x="155" y="240" width="150" height="150" rx="55" fill="url(#botPlating)" stroke="#e2e8f0" stroke-width="3"/>

    <!-- Torso Cyber Belly Accent -->
    <rect x="180" y="270" width="100" height="95" rx="35" fill="url(#botVisor)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Glowing Heart Core / DIZA AI Badge -->
    <circle cx="230" cy="317" r="24" fill="#0284c7" fill-opacity="0.3" filter="url(#botGlow)"/>
    <circle cx="230" cy="317" r="18" fill="url(#botCyanGlow)"/>
    <path d="M 230 307 L 235 315 L 243 315 L 237 320 L 239 328 L 230 323 L 221 328 L 223 320 L 217 315 L 225 315 Z" fill="#ffffff"/>

    <!-- Neck Connector -->
    <rect x="205" y="215" width="50" height="35" rx="8" fill="url(#botBluePlating)"/>
    <line x1="210" y1="225" x2="250" y2="225" stroke="#38bdf8" stroke-width="2"/>
    <line x1="210" y1="233" x2="250" y2="233" stroke="#38bdf8" stroke-width="2"/>

    <!-- HEAD GROUP -->
    <g transform="translate(0, 0)">
      <!-- Head Antenna -->
      <line x1="230" y1="100" x2="230" y2="70" stroke="#0284c7" stroke-width="5" stroke-linecap="round"/>
      <circle cx="230" cy="62" r="12" fill="url(#botCyanGlow)" filter="url(#botGlow)"/>
      <circle cx="230" cy="62" r="6" fill="#ffffff"/>
      <!-- Small Antenna Ring -->
      <ellipse cx="230" cy="80" rx="10" ry="3" fill="#38bdf8"/>

      <!-- Ear Pods / Cyber Headsets -->
      <rect x="120" y="130" width="22" height="50" rx="10" fill="url(#botBluePlating)"/>
      <circle cx="131" cy="155" r="7" fill="#22d3ee" filter="url(#botGlow)"/>

      <rect x="318" y="130" width="22" height="50" rx="10" fill="url(#botBluePlating)"/>
      <circle cx="329" cy="155" r="7" fill="#22d3ee" filter="url(#botGlow)"/>

      <!-- Main Head Helmet Shell -->
      <rect x="135" y="95" width="190" height="135" rx="50" fill="url(#botPlating)" stroke="#e2e8f0" stroke-width="3"/>

      <!-- Dark Digital Face Visor Screen -->
      <rect x="150" y="112" width="160" height="100" rx="38" fill="url(#botVisor)" stroke="#0ea5e9" stroke-width="2.5"/>

      <!-- Cute Smiling Cyan Digital Eyes -->
      <!-- Left Happy Eye (Curved Arc ^) -->
      <path d="M 180 160 Q 195 140 210 160" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" filter="url(#botGlow)"/>
      <!-- Right Happy Eye (Curved Arc ^) -->
      <path d="M 250 160 Q 265 140 280 160" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" filter="url(#botGlow)"/>

      <!-- Cute Blushing Cheeks -->
      <circle cx="178" cy="180" r="7" fill="#38bdf8" fill-opacity="0.5" filter="url(#botGlow)"/>
      <circle cx="282" cy="180" r="7" fill="#38bdf8" fill-opacity="0.5" filter="url(#botGlow)"/>

      <!-- Happy Smiling Mouth -->
      <path d="M 220 182 Q 230 193 240 182" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#botGlow)"/>
    </g>

    <!-- Shoulder Pads -->
    <circle cx="150" cy="255" r="18" fill="url(#botBluePlating)"/>
    <circle cx="310" cy="255" r="18" fill="url(#botBluePlating)"/>
  </g>
</svg>